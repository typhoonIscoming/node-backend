<!doctype html>
<html>
	<head>
		<title>Lightweight Charts 示例</title>
		<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
		<style>
			* {
				margin: 0;
				padding: 0;
			}
			#chart {
				width: 100%;
				height: 500px;
			}
		</style>
	</head>
	<body>
		<div id="chart"></div>
		<button id="addBtn">添加一根新K线</button>

		<script>
			// 1. 创建图表实例
			const chart = LightweightCharts.createChart(document.getElementById('chart'), {
				layout: { background: { color: '#1e293b' }, textColor: '#e2e8f0' },
				grid: { vertLines: { color: '#334155' }, horzLines: { color: '#334155' } },
				timeScale: { timeVisible: true, secondsVisible: false },
			});

			// 2. 添加 K 线系列
			const candlestickSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
				upColor: '#26a69a',
				downColor: '#ef5350',
				borderVisible: false,
			});

			// 3. 添加成交量直方图系列
			const volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
				priceFormat: { type: 'volume' },
				priceScaleId: 'volume', // 使用独立的坐标轴，避免挤压K线
			});

			// 4. 生成模拟数据并设置
			const mockData = [];
			for (let i = 30; i >= 0; i--) {
				const time = new Date(Date.now() - i * 24 * 60 * 60 * 1000); // 过去的小时
				const open = 2000 + Math.random() * 100;
				const close = open + (Math.random() - 0.5) * 50;
				mockData.push({
					time: time.toISOString().slice(0, 10),
					open: open,
					high: Math.max(open, close) + Math.random() * 20,
					low: Math.min(open, close) - Math.random() * 20,
					close: close,
				});
			}
			console.log('mockData', mockData);
			candlestickSeries.setData(mockData);
			// volumeSeries.setData(
			// 	mockData.map((d) => ({
			// 		time: d.time,
			// 		value: Math.random() * 10000,
			// 		color: d.close >= d.open ? 'rgba(38, 166, 154, 0.5)' : 'rgba(239, 83, 80, 0.5)',
			// 	}))
			// );

			// 5. 模拟实时更新
			document.getElementById('addBtn').addEventListener('click', () => {
				const last = mockData[mockData.length - 1];
				const newTime = new Date(new Date(last.time).getTime() + 60 * 60 * 1000)
					.toISOString()
					.slice(0, 10);
				console.log('newTime', newTime);
				const newClose = last.close + (Math.random() - 0.5) * 30;

				const newCandle = {
					time: newTime,
					open: last.close,
					high: Math.max(last.close, newClose) + Math.random() * 10,
					low: Math.min(last.close, newClose) - Math.random() * 10,
					close: newClose,
				};

				mockData.push(newCandle);
				// 关键：使用 update 方法，性能远优于重新 setData
				candlestickSeries.update(newCandle);
				volumeSeries.update({
					time: newTime,
					value: Math.random() * 10000,
					color:
						newCandle.close >= newCandle.open
							? 'rgba(38, 166, 154, 0.5)'
							: 'rgba(239, 83, 80, 0.5)',
				});
			});
		</script>
	</body>
</html>
